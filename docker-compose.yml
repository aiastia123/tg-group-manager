version: "3.8"

services:
  group-manager:
    image: ghcr.io/aiastia123/tg-group-manager:main
    # build: .  # 本地构建时取消注释
    container_name: tg-group-manager
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DB_PATH=/app/data/bot.db
    volumes:
      - ./data:/app/data
